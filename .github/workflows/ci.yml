# InsightOps CI/CD — GitHub Actions.
#
#   push to main -> test -> build+push image (commit-sha tag, GHCR) ->
#   deploy (EC2 + S3/CloudFront) -> API smoke tests
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEEPSEEK_API_KEY        - DeepSeek API key for the deployed environment
#   SSH_PRIVATE_KEY         - private key for the EC2 deploy user
#   SSH_USER                - EC2 SSH user (default ec2-user)
#   EC2_HOST                - EC2 public DNS/IP
#   DEPLOYMENT_URL          - e.g. http://<ec2-public-dns>:8000
#   AWS_ACCESS_KEY_ID       - workflow credentials for S3/CloudFront
#   AWS_SECRET_ACCESS_KEY
#   AWS_DEFAULT_REGION
#   S3_FRONTEND_BUCKET      - from CloudFormation output FrontendBucketName
#   CLOUDFRONT_DISTRIBUTION_ID
#   PROD_ENV_FILE           - (optional) path to the prod .env to upload
#
# Secrets are only referenced as ${{ secrets.* }} / ${{ github.token }},
# never written to the repository.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Needed to push the backend image to the GitHub Container Registry.
  packages: write

env:
  # GHCR image names must be lowercase.
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

jobs:
  # ------------------------------------------------------------------------
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

  # ------------------------------------------------------------------------
  build:
    name: Build + publish backend image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

  # ------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH + Docker Compose
        run: ./deploy/deploy_ec2.sh
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
          REGISTRY: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          VITE_API_BASE_URL=${{ secrets.DEPLOYMENT_URL }} npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Sync to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # ------------------------------------------------------------------------
  smoke:
    name: Post-deployment API smoke tests
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: pip install -r tests/smoke/requirements.txt
      - name: Run smoke tests
        env:
          BASE_URL: ${{ secrets.DEPLOYMENT_URL }}
        run: python -m pytest tests/smoke -q
