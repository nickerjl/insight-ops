# InsightOps production stack — runs on EC2.
#
#   IMAGE=<registry>/insight-ops/backend:<commit-sha> docker compose \
#     -f docker-compose.prod.yml -p insight-ops up -d
#
# The exact commit-tagged image from CI (GitHub Actions -> GHCR) is used (never `latest`).
# Containers publish structured logs to CloudWatch via the awslogs driver
# using the EC2 instance role (no credentials inside the image).
#
# Environment variables come from /opt/insight-ops/.env.prod on the host
# (managed by the deploy script / CI, never committed).

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required (registry image tagged with commit sha)}
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - /opt/insight-ops/.env.prod
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-group: /insight-ops/prod
        awslogs-region: ${AWS_REGION:-eu-west-1}
        awslogs-stream-prefix: api

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    command: ["dramatiq", "app.tasks"]
    env_file:
      - /opt/insight-ops/.env.prod
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-group: /insight-ops/prod
        awslogs-region: ${AWS_REGION:-eu-west-1}
        awslogs-stream-prefix: worker

volumes:
  redis-data:
